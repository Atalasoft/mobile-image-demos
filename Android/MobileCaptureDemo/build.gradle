apply plugin: 'com.android.application'

def vcode = (int)(((new Date().getTime()/1000) - 1645454402) / 30)

android {
    namespace "com.kofax.samples.mobilecapturedemo"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.kofax.samples.mobilecapturedemo"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode vcode
        versionName "1.2.6"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        vectorDrawables.useSupportLibrary = true
    }

    packagingOptions {
        exclude 'kotlin/*'
        exclude 'kotlin/reflect/*'
        exclude 'kotlin/coroutines/coroutines.kotlin_builtins'
    }

    repositories {
        flatDir { dirs '../MobileSDK_libs' }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['../MobileSDK_libs']
        }
    }
    buildFeatures {
        buildConfig = true
    }

    configurations.all {
        exclude group: "com.android.tools", module: "common"
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
        }
    }
}

dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation fileTree(
            dir: '../MobileSDK_libs',
            exclude: ['javax.inject-1.jar','kotlin-stdlib-1.9.10.jar', 'kotlin-stdlib-jdk7-1.9.10.jar', 'kotlin-stdlib-jdk8-1.9.10.jar', 'annotations-13.0.jar'],
            include: ['*.jar']
    )
    implementation("com.google.android.gms:play-services-mlkit-barcode-scanning:17.0.0") {
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib"
    }
    implementation(name: 'sdk-release', ext: 'aar')
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    implementation project(':')
}
